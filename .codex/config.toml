# Codex CLI config for gc-erp-mcp-server.
# See docs/guides/codex.md for design rationale.
#
# IMPORTANT: this file does NOT load until the user accepts the trust
# prompt on Codex's first run in this repo. Verify the policy is in
# effect after trusting with `codex execpolicy check '<some command>'`.

# Coarse approval gates. Fine-grained allow / forbid lives in
# rules/policy.rules.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# MCP servers — mirrors .mcp.json + .claude/settings.json's
# `enabledMcpjsonServers`. Same servers, different config shape.

[mcp_servers.codescene]
command = "npx"
args = ["@codescene/codehealth-mcp"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

# No SessionStart / hook block here: Codex is launched inside a worktree
# that Zed's create_worktree task has already bootstrapped. Bare-terminal
# `git worktree add` + `codex` falls back to `just bootstrap` manually,
# same as any other non-Zed entry point.
